name: medikal_uygulama
description: "US medical equipment (DME) and wound care donation platform with AI Vision support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  path: ^1.9.0
  flutter_typeahead: ^6.0.0
  google_maps_webservice: ^0.0.20-nullsafety.5
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.17.1
  pdf: ^3.13.0
  mobile_scanner: ^7.4.0
  http: ^1.6.0

dependency_overrides:
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by test/generate_brand_icons_test.dart to strip the alpha channel
  # from exported iOS app icons, which App Store Connect rejects.
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/lang/
