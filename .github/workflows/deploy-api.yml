# Deploys the MedGift Node API to Render via Deploy Hook.
# Setup (one-time):
#   1. https://dashboard.render.com → New → Blueprint → connect this repo (render.yaml)
#   2. In the medgift-us-api service, set env vars from server/.env
#      (EMAIL_PASS, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, …)
#   3. Settings → Deploy Hook → copy URL → GitHub secret RENDER_DEPLOY_HOOK
#   4. Copy the service URL (https://medgift-us-api.onrender.com) → secret API_BASE_URL
#   5. Re-run Deploy Web so Flutter picks up API_BASE_URL

name: Deploy API

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping."
            echo "Create the Render Blueprint from render.yaml, then add the Deploy Hook secret."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered."
