# Builds Flutter web and deploys to GitHub Pages (gh-pages branch)
# OR Firebase Hosting when secrets are configured.
#
# Live URLs:
#   https://medgift.us
#   https://www.medgift.us  (CNAME → cigdemtuerdi-hue.github.io)
#
# DNS (GoDaddy example):
#   A     @     185.199.108.153  (+ .109/.110/.111)
#   CNAME www   cigdemtuerdi-hue.github.io
#
# Custom domain file:
#   web/CNAME (+ repo-root CNAME) → medgift.us
#   Published on every gh-pages deploy via peaceiris cname + build/web/CNAME
#
# Pages setup:
#   Settings → Pages → Custom domain: medgift.us → Enforce HTTPS
#
# Google Maps API key HTTP referrers (Cloud Console):
#   https://medgift.us/*
#   https://www.medgift.us/*
# Secret (optional, for dart-define / .env asset):
#   GOOGLE_MAPS_API_KEY

name: Deploy Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Hosting target"
        required: true
        default: github-pages
        type: choice
        options:
          - github-pages
          - firebase

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env for asset bundle
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          ADMIN_EMAIL_ENDPOINT: ${{ secrets.ADMIN_EMAIL_ENDPOINT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Default matches render.yaml service name when secret is empty.
          API_BASE_URL="${API_BASE_URL:-https://medgift-us-api.onrender.com}"
          # Do NOT bake ADMIN_PASSWORD into the web bundle — verify on the API only.
          cat > .env << EOF
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          ADMIN_NOTIFY_EMAIL=${ADMIN_NOTIFY_EMAIL}
          ADMIN_EMAIL_ENDPOINT=${ADMIN_EMAIL_ENDPOINT}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PIN=${ADMIN_PIN}
          API_BASE_URL=${API_BASE_URL}
          EOF
          sed -i 's/^[[:space:]]*//' .env
          test -s .env || echo "GOOGLE_MAPS_API_KEY=" > .env
          echo "Using API_BASE_URL=${API_BASE_URL}"
          echo "Admin email configured: $([ -n \"$ADMIN_EMAIL\" ] && echo yes || echo no)"

      - name: Inject Google Maps JS key into web/index.html
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          key = (os.environ.get("GOOGLE_MAPS_API_KEY") or "").strip()
          path = pathlib.Path("web/index.html")
          text = path.read_text()
          if not key:
              print("WARNING: GOOGLE_MAPS_API_KEY secret empty — keeping index.html key as-is")
              raise SystemExit(0)
          updated, count = re.subn(
              r"(maps\.googleapis\.com/maps/api/js\?key=)[^&\"']+",
              rf"\1{key}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find Maps JS key in web/index.html")
          path.write_text(updated)
          print(f"Injected Maps JS key into web/index.html (len={len(key)})")
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build web
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # Custom domain (medgift.us) and Firebase serve from site root.
          # github.io/repo path still works as a redirect once the custom domain is set.
          API_BASE_URL="${API_BASE_URL:-https://medgift-us-api.onrender.com}"
          flutter build web --release \
            --base-href / \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Ensure CNAME for medgift.us in build output
        if: ${{ github.event.inputs.target != 'firebase' }}
        run: |
          # web/CNAME is copied by Flutter into build/web; rewrite to guarantee apex domain.
          echo "medgift.us" > build/web/CNAME
          # SPA fallback so /forgot-password and /reset-password/:token work on GitHub Pages.
          cp build/web/index.html build/web/404.html
          # Real folder so /admin and /admin/ return 200 (not only 404.html).
          mkdir -p build/web/admin
          cp build/web/index.html build/web/admin/index.html
          echo "Published CNAME=$(cat build/web/CNAME)"
          echo "Admin deep-link folder ready: build/web/admin/index.html"

      - name: Deploy to GitHub Pages (gh-pages)
        if: ${{ github.event.inputs.target != 'firebase' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          cname: medgift.us
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Deploy to Firebase Hosting
        if: ${{ github.event.inputs.target == 'firebase' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: medgift-us
