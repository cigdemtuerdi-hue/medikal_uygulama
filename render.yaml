services:
  - type: web
    name: medgift-us-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set in Render Dashboard → Environment (do not commit the real URI):
      #   MONGODB_URI=mongodb+srv://USER:PASS@cluster.../medgift_us
      #   USE_MEMORY_DB=false
      - key: MONGODB_URI
        sync: false
      - key: USE_MEMORY_DB
        value: "false"
      - key: APP_ORIGIN
        value: https://medgift.us
      - key: EMAIL_DRY_RUN
        value: "false"
      - key: FROM_EMAIL
        value: info@medgift.us
      - key: EMAIL_HOST
        value: smtpout.secureserver.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        value: info@medgift.us
      - key: EMAIL_PASS
        sync: false
      - key: SEED_DEMO_USER_EMAIL
        value: donor@medgift.us
      - key: SEED_DEMO_USER_PHONE
        value: "+15551234567"
      # Demo login for memory-DB deploys (free Render). Change after Mongo is wired.
      - key: SEED_DEMO_USER_PASSWORD
        value: MedGiftDemo1!
      # Owner admin console — set ADMIN_PASSWORD in Render Dashboard (do not commit).
      - key: ADMIN_EMAIL
        value: info@medgift.us
      - key: ADMIN_PASSWORD
        sync: false
